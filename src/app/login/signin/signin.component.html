<main class="login-page">
  <section class="login-card" aria-label="Inventory login">
    <div class="login-card__brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" role="img">
          <path d="M4 7.5 12 3l8 4.5-8 4.5-8-4.5Z"></path>
          <path d="m4 12 8 4.5 8-4.5M4 16.5l8 4.5 8-4.5"></path>
        </svg>
      </div>
      <span>Inventory</span>
    </div>

    <div class="login-card__content">
      <header class="login-header">
        <p class="login-header__eyebrow">Welcome back</p>
        <h1>Sign in to your account</h1>
      </header>

      <form class="login-form">
        <label class="field">
          <span>Email address</span>
          <div class="field__control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m4 7 8 6 8-6"></path>
            </svg>
            <input type="email" name="email" placeholder="you@example.com" autocomplete="email">
          </div>
        </label>

        <label class="field">
          <span>Password</span>
          <div class="field__control">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="10" width="16" height="11" rx="2"></rect>
              <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          </div>
        </label>

        <button type="submit" class="login-button">Sign in</button>
      </form>
    </div>
  </section>
</main>
